<body class="bg-black text-white selection:bg-cyan-500/30 overflow-x-hidden min-h-screen">
  <div id="root"></div>

  <!-- React application with Babel translation compiler -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { 
      Heart, 
      Zap, 
      BookOpen, 
      Award, 
      RotateCcw, 
      Play, 
      Flame, 
      Shield, 
      Hourglass, 
      AlertCircle, 
      Sparkles, 
      ChevronRight,
      RefreshCw,
      Trophy,
      CheckCircle,
      XCircle,
      HelpCircle,
      Gamepad2
    } = LucideReact;

    // --- MATH UTILITIES & INTEGRAL GENERATION ENGINE ---
    const TA = [2, 3, 4, 5, -1, -2, -3, -4, -5];
    const AA = [2, 3, 5];

    function getRandomElement(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getGCD(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b) {
        const temp = b;
        b = a % b;
        a = temp;
      }
      return a;
    }

    function ve(A, b) {
      if (A === 0) return "0";
      const B = A * b < 0 ? "-" : "";
      let z = Math.abs(A);
      let O = Math.abs(b);
      const gcd = getGCD(z, O);
      z /= gcd;
      O /= gcd;
      return O === 1 ? (z === 1 ? (B === "-" ? "-" : "") : B + z) : `${B}\\frac{${z}}{${O}}`;
    }

    function formatCoefficient(num, den, variableSuffix) {
      if (num === 0) return "0";
      const sign = num * den < 0 ? "-" : "";
      let absNum = Math.abs(num);
      let absDen = Math.abs(den);
      const gcd = getGCD(absNum, absDen);
      absNum /= gcd;
      absDen /= gcd;

      if (absDen === 1) {
        if (absNum === 1 && variableSuffix !== "") {
          return sign + variableSuffix;
        }
        return sign + absNum + variableSuffix;
      } else {
        if (absNum === 1 && variableSuffix !== "") {
          return sign === "-" ? `-\\frac{${variableSuffix}}{${absDen}}` : `\\frac{${variableSuffix}}{${absDen}}`;
        }
        return `${sign}\\frac{${absNum}}{${absDen}}${variableSuffix}`;
      }
    }

    function formatSimpleFraction(num, den) {
      if (num === 0) return "0";
      const sign = num * den < 0 ? "-" : "";
      let absNum = Math.abs(num);
      let absDen = Math.abs(den);
      const gcd = getGCD(absNum, absDen);
      absNum /= gcd;
      absDen /= gcd;

      if (absDen === 1) {
        return `${sign}${absNum}`;
      }
      return `${sign}\\frac{${absNum}}{${absDen}}`;
    }

    function generateRA(type) {
      const b = getRandomElement(TA); // Coefficient
      const B = getRandomElement(AA); // Base [2,3,5]
      let qTerm = "", cAns = "", d1 = "", d2 = "", d3 = "", d4 = "", d5 = "";
      let category = "多項式・累乗根";
      let explanation = "";

      let powerOption = null;
      if (type === 9) powerOption = getRandomElement([{ p: -3, q: 1 }, { p: -4, q: 1 }, { p: -5, q: 1 }]);
      if (type === 10) powerOption = getRandomElement([{ p: 1, q: 3 }, { p: 1, q: 4 }, { p: 2, q: 3 }]);
      if (type === 11) powerOption = { p: 3, q: 2 };
      if (type === 12) powerOption = { p: -1, q: 2 };
      if (type === 13) powerOption = { p: -4, q: 1 };
      if (type === 15) powerOption = { p: 1, q: 2 };
      if (type === 16) powerOption = { p: -1, q: 2 };

      if (type === 1 || powerOption) {
        const powerFormatter = (me, X, U, le) => {
          if (me === 0) return "0";
          const qe = me * X < 0 ? "-" : "";
          let dt = Math.abs(me);
          let Ge = Math.abs(X);
          const gcd = getGCD(dt, Ge);
          dt /= gcd;
          Ge /= gcd;
          let ye = "";
          const isNeg = U < 0;
          const absoluteU = Math.abs(U);

          if (absoluteU === 0) {
            ye = "";
          } else if (le === 1) {
            ye = absoluteU === 1 ? "x" : `x^{${absoluteU}}`;
          } else if (le === 2) {
            ye = absoluteU === 1 ? "\\sqrt{x}" : absoluteU === 3 ? "x\\sqrt{x}" : `x^{\\frac{${absoluteU}}{2}}`;
          } else {
            ye = absoluteU === 1 ? `x^{\\frac{1}{${le}}}` : `x^{\\frac{${absoluteU}}{${le}}}`;
          }

          if (isNeg) {
            if (dt === 1 && Ge === 1) return `${qe}\\frac{1}{${ye}}`;
            if (Ge === 1) return `${qe}\\frac{${dt}}{${ye}}`;
            return `${qe}\\frac{${dt}}{${Ge}${ye}}`;
          }
          if (dt === 1 && Ge === 1) return ye === "" ? qe + "1" : qe === "-" ? "-" + ye : ye;
          if (Ge === 1) return qe + dt + ye;
          if (dt === 1 && ye !== "") return qe === "-" ? `-\\frac{${ye}}{${Ge}}` : `\\frac{${ye}}{${Ge}}`;
          return `${qe}\\frac{${dt}}{${Ge}}${ye}`;
        };

        const power = powerOption || getRandomElement([
          { p: -4, q: 1 }, { p: -3, q: 1 }, { p: -2, q: 1 }, 
          { p: 2, q: 1 }, { p: 3, q: 1 }, { p: 4, q: 1 }, { p: 5, q: 1 }, 
          { p: 1, q: 2 }, { p: 1, q: 3 }, { p: 3, q: 2 }, { p: 1, q: 4 }, 
          { p: -1, q: 2 }, { p: -1, q: 3 }, { p: -2, q: 3 }
        ]);
        const N = power.p;
        const F = power.q;
        let Ne = b;
        let oe = 1;
        if (type === 16) {
          Ne = 1;
          oe = b;
        }

        qTerm = powerFormatter(Ne, oe, N, F);
        cAns = powerFormatter(Ne * F, oe * (N + F), N + F, F);
        d1 = powerFormatter(Ne * N, oe * F, N - F, F);
        d2 = powerFormatter(Ne, oe, N + F, F);
        d3 = powerFormatter(-Ne * F, oe * (N + F), N + F, F);
        d4 = powerFormatter(Ne, oe, N, F);
        d5 = powerFormatter(-Ne, oe, N + F, F);
        category = (N < 0 || F > 1) ? "累乗根・有理数冪" : "多項式関数";

        explanation = `冪乗の基本公式 \\(\\int x^n \\,dx = \\frac{x^{n+1}}{n+1} + C\\) (ただし \\(n \\neq -1\\)) を適用します。

本問は \\(n = \\frac{${N}}{${F}}\\) です。
指数の加算結果は \\(n + 1 = \\frac{${N + F}}{${F}}\\) となり、その逆数を掛け、累乗根の形に整理しています。`;
      } else if (type === 2) {
        category = "分数・対数関数";
        qTerm = formatSimpleFraction(b, 1) + "\\frac{1}{x}";
        cAns = formatCoefficient(b, 1, "\\log|x|");
        d1 = formatCoefficient(b, 1, "\\log x");
        d2 = formatCoefficient(-b, 1, "\\frac{1}{x^2}");
        d3 = formatCoefficient(b, 2, "x^2");
        d4 = formatCoefficient(-b, 1, "\\log|x|");
        d5 = formatCoefficient(b, 1, "\\frac{1}{x^2}");
        explanation = `\\(\\int \\frac{1}{x} \\,dx = \\log|x| + C\\) の対数公式を直接適用します。
積分結果の対数の真数部分には必ず **絶対値記号** \\(|x|\\) を付与します。`;
      } else if (type === 3) {
        category = "三角関数";
        qTerm = formatCoefficient(b, 1, "\\sin x");
        cAns = formatCoefficient(-b, 1, "\\cos x");
        d1 = formatCoefficient(b, 1, "\\cos x");
        d2 = formatCoefficient(-b, 1, "\\sin x");
        d3 = formatCoefficient(b, 1, "\\sin x");
        d4 = formatCoefficient(b, 2, "\\sin^2 x");
        d5 = formatCoefficient(-b, 2, "\\cos^2 x");
        explanation = `三角関数の基本公式 \\(\\int \\sin x \\,dx = -\\cos x + C\\) を使用します。
微分の時に \\((\\cos x)' = -\\sin x\\) となっていた「マイナスの符号」を逆に積分に適用するため、符号の変化に細心の注意を払いましょう。`;
      } else if (type === 4) {
        category = "三角関数";
        qTerm = formatCoefficient(b, 1, "\\cos x");
        cAns = formatCoefficient(b, 1, "\\sin x");
        d1 = formatCoefficient(-b, 1, "\\sin x");
        d2 = formatCoefficient(b, 1, "\\cos x");
        d3 = formatCoefficient(-b, 1, "\\cos x");
        d4 = formatCoefficient(-b, 2, "\\cos^2 x");
        d5 = formatCoefficient(b, 2, "\\sin^2 x");
        explanation = `基本公式 \\(\\int \\cos x \\,dx = \\sin x + C\\) を用います。
\\(\\sin x\\) からの微分では \\(\\cos x\\) の符号は正のまま変化しません。`;
      } else if (type === 5) {
        category = "三角関数";
        qTerm = formatSimpleFraction(b, 1) + "\\frac{1}{\\cos^2 x}";
        cAns = formatCoefficient(b, 1, "\\tan x");
        d1 = formatCoefficient(-b, 1, "\\tan x");
        d2 = formatSimpleFraction(b, 1) + "\\frac{1}{\\sin^2 x}";
        d3 = formatSimpleFraction(-b, 1) + "\\frac{1}{\\tan x}";
        d4 = formatCoefficient(b, 1, "\\frac{1}{\\tan x}");
        d5 = formatCoefficient(-b, 1, "\\frac{1}{\\tan x}");
        explanation = `\\(\\tan x\\) の微分公式 \\((\\tan x)' = \\frac{1}{\\cos^2 x}\\) より、その逆の積分として
\\(\\int \\frac{1}{\\cos^2 x} \\,dx = \\tan x + C\\) が導かれます。`;
      } else if (type === 6) {
        category = "三角関数";
        qTerm = formatSimpleFraction(b, 1) + "\\frac{1}{\\sin^2 x}";
        cAns = formatCoefficient(-b, 1, "\\frac{1}{\\tan x}");
        d1 = formatCoefficient(b, 1, "\\frac{1}{\\tan x}");
        d2 = formatCoefficient(-b, 1, "\\tan x");
        d3 = formatCoefficient(b, 1, "\\tan x");
        d4 = formatSimpleFraction(b, 1) + "\\frac{1}{\\cos^2 x}";
        d5 = formatSimpleFraction(-b, 1) + "\\frac{1}{\\sin^2 x}";
        explanation = `コタンジェントの微分公式 \\((\\frac{1}{\\tan x})' = -\\frac{1}{\\sin^2 x}\\) を逆算します。
\\(\\int \\frac{1}{\\sin^2 x} \\,dx = -\\frac{1}{\\tan x} + C\\) と、マイナス記号が付くことを忘れないようにしましょう。`;
      } else if (type === 7) {
        category = "指数関数";
        qTerm = formatCoefficient(b, 1, "e^x");
        cAns = formatCoefficient(b, 1, "e^x");
        d1 = formatCoefficient(b, 1, "x e^{x-1}");
        d2 = formatCoefficient(-b, 1, "e^x");
        d3 = formatCoefficient(b, 2, "e^{2x}");
        d4 = formatCoefficient(b, 1, "e^{x+1}");
        d5 = formatCoefficient(-b, 1, "x e^x");
        explanation = `自然対数の底 \\(e^x\\) は積分しても微分しても自身の形を変えません。
\\(\\int e^x \\,dx = e^x + C\\) を用いる最もシンプルなパターンです。`;
      } else if (type === 8) {
        category = "指数関数";
        const dotStr = b === 1 ? "" : b === -1 ? "-" : b + "\\cdot ";
        const coeffAbs = Math.abs(b) === 1 ? "" : Math.abs(b) + "\\cdot ";
        const negSign = b < 0 ? "-" : "";
        const normalFormat = b === 1 ? "" : b === -1 ? "-" : b + "\\cdot ";

        qTerm = `${dotStr}${B}^x`;
        cAns = `${negSign}\\frac{${coeffAbs}${B}^x}{\\log ${B}}`;
        d1 = `${normalFormat}${B}^x \\log ${B}`;
        d2 = `${normalFormat}${B}^x`;
        d3 = `${negSign === "-" ? "" : "-"}\\frac{${coeffAbs}${B}^x}{\\log ${B}}`;
        d4 = `${normalFormat}x ${B}^{x-1}`;
        d5 = `${negSign}\\frac{${coeffAbs}${B}^{x+1}}{x+1}`;
        explanation = `一般の指数関数 \\(a^x\\) (底が \\(e\\) 以外の数、本問では \\(a = ${B}\\)) の積分を行います。
微分すると \\(a^x \\log a\\) ですが、積分では分母に \\(\\log a\\) が現れます。
\\(\\int a^x \\,dx = \\frac{a^x}{\\log a} + C\\) の定数倍です。`;
      } else if (type === 14) {
        category = "指数関数";
        qTerm = formatCoefficient(b, 1, "e^{x+2}");
        cAns = formatCoefficient(b, 1, "e^{x+2}");
        d1 = formatCoefficient(b, 1, "e^{x+3}");
        d2 = formatCoefficient(-b, 1, "e^{x+2}");
        d3 = formatCoefficient(b, 2, "e^{x+2}");
        d4 = formatCoefficient(b, 1, "x e^{x+2}");
        d5 = formatCoefficient(b, 1, "e^{x+1}");
        explanation = `\\(e^{x+c}\\) 型の積分です。指数部分の一次の係数が1なので、通常の \\(e^x\\) の積分公式と同様にそのまま自身が原始関数となります。`;
      }

      return { qTerm, cAns, d1, d2, d3, d4, d5, category, explanation };
    }

    function generateDA() {
      const coeffGrid = [1, 2, -1, -2, 3, -3, 0.5, -0.5];
      const bVal = getRandomElement(coeffGrid);
      const BVal = getRandomElement(coeffGrid);

      const z = bVal === 0.5 ? 1 : bVal === -0.5 ? -1 : bVal;
      const O = bVal === 0.5 || bVal === -0.5 ? 2 : 1;
      const dol = BVal === 0.5 ? 1 : BVal === -0.5 ? -1 : BVal;
      const be = BVal === 0.5 || BVal === -0.5 ? 2 : 1;

      let xTerm = "";
      if (O === 2) {
        xTerm = z === 1 ? "\\frac{x}{2}" : "-\\frac{x}{2}";
      } else {
        xTerm = z === 1 ? "x" : z === -1 ? "-x" : z + "x";
      }

      if (be === 2) {
        xTerm += dol === 1 ? "+\\frac{1}{2}" : "-\\frac{1}{2}";
      } else {
        xTerm += dol > 0 ? "+" + dol : (dol < 0 ? dol : "");
      }

      const exprRaw = xTerm;
      const parenthesized = "\\left(" + xTerm + "\\right)";
      const selectedType = getRandomElement([1, 2, 3, 4, 5, 7]);
      let qTerm = "", cAns = "", d1 = "", d2 = "", d3 = "", d4 = "", d5 = "";
      let typeName = "";
      let baseExpl = "";

      function formatTerms(coeff, base) {
        if (coeff === "0") return "0";
        if (coeff === "" && base !== "") return base;
        if (coeff === "-" && base !== "") return "-" + base;
        if (coeff === "" && base === "") return "1";
        if (coeff === "-" && base === "") return "-1";
        return coeff + base;
      }

      if (selectedType === 1) {
        typeName = "多項式合成積分";
        const power = getRandomElement([2, 3]);
        const initCoeff = getRandomElement([1, -1, 2, -2]);
        qTerm = formatTerms(ve(initCoeff, 1), parenthesized + "^{" + power + "}");
        const divisor = ve(initCoeff * O, z * (power + 1));
        cAns = formatTerms(divisor, parenthesized + "^{" + (power + 1) + "}");
        d1 = formatTerms(ve(initCoeff, power + 1), parenthesized + "^{" + (power + 1) + "}");
        d2 = formatTerms(ve(initCoeff * z, O * (power + 1)), parenthesized + "^{" + (power + 1) + "}");
        d3 = formatTerms(divisor, parenthesized + "^{" + power + "}");
        d4 = formatTerms(ve(-initCoeff * O, z * (power + 1)), parenthesized + "^{" + (power + 1) + "}");
        d5 = formatTerms(ve(initCoeff * O, z * (power + 2)), parenthesized + "^{" + (power + 2) + "}");
        baseExpl = `全体が \\(u^n\\) の形をした累乗関数の合成です。通常の積分を行った後、一次式 \\(${exprRaw}\\) の微分である係数 \\(${ve(z, O)}\\) の逆数を掛け算します。`;
      } else if (selectedType === 2) {
        typeName = "対数合成積分";
        const initCoeff = getRandomElement([1, -1, 2, -2]);
        if (initCoeff === 1) qTerm = "\\frac{1}{" + parenthesized + "}";
        else if (initCoeff === -1) qTerm = "-\\frac{1}{" + parenthesized + "}";
        else qTerm = formatTerms(ve(initCoeff, 1), "\\frac{1}{" + parenthesized + "}");

        const outerFactor = ve(initCoeff * O, z);
        cAns = formatTerms(outerFactor, "\\log|" + exprRaw + "|");
        d1 = formatTerms(ve(initCoeff, 1), "\\log|" + exprRaw + "|");
        d2 = formatTerms(ve(initCoeff * z, O), "\\log|" + exprRaw + "|");
        d3 = formatTerms(ve(-initCoeff * O, z), "\\log|" + exprRaw + "|");
        d4 = formatTerms(ve(-initCoeff * O, z), "\\frac{1}{" + parenthesized + "}");
        d5 = formatTerms(ve(initCoeff * O, z), "\\frac{1}{" + parenthesized + "}");
        baseExpl = `\\(\\int \\frac{1}{ax+b} \\,dx = \\frac{1}{a} \\log|ax+b| + C\\) の定数を掛け合わせる1次置換積分です。`;
      } else if (selectedType === 3) {
        typeName = "三角合成積分 (cos)";
        const initCoeff = getRandomElement([1, -1, 2, -2]);
        qTerm = formatTerms(ve(initCoeff, 1), "\\cos" + parenthesized);
        const outerFactor = ve(initCoeff * O, z);
        cAns = formatTerms(outerFactor, "\\sin" + parenthesized);
        d1 = formatTerms(ve(-initCoeff * O, z), "\\sin" + parenthesized);
        d2 = formatTerms(outerFactor, "\\cos" + parenthesized);
        d3 = formatTerms(ve(-initCoeff * O, z), "\\cos" + parenthesized);
        d4 = formatTerms(ve(initCoeff, 1), "\\sin" + parenthesized);
        d5 = formatTerms(ve(initCoeff * z, O), "\\sin" + parenthesized);
        baseExpl = `\\(\\int \\cos(ax+b) \\,dx = \\frac{1}{a} \\sin(ax+b) + C\\) の合成積分です。`;
      } else if (selectedType === 4) {
        typeName = "三角合成積分 (sin)";
        const initCoeff = getRandomElement([1, -1, 2, -2]);
        qTerm = formatTerms(ve(initCoeff, 1), "\\sin" + parenthesized);
        const outerFactor = ve(-initCoeff * O, z);
        cAns = formatTerms(outerFactor, "\\cos" + parenthesized);
        d1 = formatTerms(ve(initCoeff * O, z), "\\cos" + parenthesized);
        d2 = formatTerms(outerFactor, "\\sin" + parenthesized);
        d3 = formatTerms(ve(initCoeff * O, z), "\\sin" + parenthesized);
        d4 = formatTerms(ve(-initCoeff, 1), "\\cos" + parenthesized);
        d5 = formatTerms(ve(-initCoeff * z, O), "\\cos" + parenthesized);
        baseExpl = `\\(\\int \\sin(ax+b) \\,dx = -\\frac{1}{a} \\cos(ax+b) + C\\) となり、マイナス符号の適用と係数調整が必要です。`;
      } else if (selectedType === 5) {
        typeName = "三角合成積分 (tan)";
        const initCoeff = getRandomElement([1, -1, 2, -2]);
        if (initCoeff === 1) qTerm = "\\frac{1}{\\cos^2" + parenthesized + "}";
        else if (initCoeff === -1) qTerm = "-\\frac{1}{\\cos^2" + parenthesized + "}";
        else qTerm = formatTerms(ve(initCoeff, 1), "\\frac{1}{\\cos^2" + parenthesized + "}");

        const outerFactor = ve(initCoeff * O, z);
        cAns = formatTerms(outerFactor, "\\tan" + parenthesized);
        d1 = formatTerms(ve(-initCoeff * O, z), "\\tan" + parenthesized);
        d2 = formatTerms(ve(initCoeff, 1), "\\tan" + parenthesized);
        d3 = formatTerms(outerFactor, "\\frac{1}{\\tan" + parenthesized + "}");
        d4 = formatTerms(ve(-initCoeff * O, z), "\\frac{1}{\\tan" + parenthesized + "}");
        d5 = formatTerms(ve(initCoeff * z, O), "\\tan" + parenthesized);
        baseExpl = `\\(\\int \\frac{1}{\\cos^2(ax+b)} \\,dx = \\frac{1}{a} \\tan(ax+b) + C\\) の公式を適用します。`;
      } else if (selectedType === 7) {
        typeName = "指数合成積分 (e)";
        const initCoeff = getRandomElement([1, -1, 2, -2]);
        qTerm = formatTerms(ve(initCoeff, 1), "e^{" + exprRaw + "}");
        const outerFactor = ve(initCoeff * O, z);
        cAns = formatTerms(outerFactor, "e^{" + exprRaw + "}");
        d1 = formatTerms(ve(-initCoeff * O, z), "e^{" + exprRaw + "}");
        d2 = formatTerms(ve(initCoeff, 1), "e^{" + exprRaw + "}");
        d3 = formatTerms(ve(initCoeff * z, O), "e^{" + exprRaw + "}");
        d4 = formatTerms(outerFactor, parenthesized + "e^{" + exprRaw + "-1}");
        d5 = formatTerms(ve(initCoeff, 1), parenthesized + "e^{" + exprRaw + "}");
        baseExpl = `\\(\\int e^{ax+b} \\,dx = \\frac{1}{a} e^{ax+b} + C\\) をベースに係数計算を行います。`;
      }

      const explanation = `${typeName} (置換積分法)
1次式 \\(ax+b\\) が合成されている関数の積分では、
外側の基本的な積分結果 \\(F(x)\\) を求めた上で、**中身の1次式の \\(x\\) の係数の逆数である \\(\\frac{1}{a}\\)** を全体に掛け算します。
本問の1次式中身は \\(ax+b = ${exprRaw}\\) です。
よって \\(x\\) の係数である \\(a = ${ve(z, O)}\\) の逆数 \\(\\frac{1}{a} = ${ve(O, z)}\\) を最終型に掛け算するルールになります。

${baseExpl}`;

      return { qTerm, cAns, d1, d2, d3, d4, d5, category: "1次合成（置換積分）", explanation };
    }

    function joinFormulaAnswers(ansArray) {
      if (!ansArray || ansArray.length === 0) return "";
      let out = ansArray[0];
      for (let i = 1; i < ansArray.length; i++) {
        if (ansArray[i].startsWith("-")) {
          out += " " + ansArray[i];
        } else {
          out += " + " + ansArray[i];
        }
      }
      return out;
    }

    function buildQuizItem(forceComposite, chosenType = null) {
      const parts = [];
      if (forceComposite) {
        parts.push(generateDA());
      } else {
        parts.push(generateRA(chosenType !== null ? chosenType : Math.floor(Math.random() * 16) + 1));
      }

      const qText = `\\int ` + (forceComposite || parts[0].qTerm.includes("+") || parts[0].qTerm.substring(1).includes("-") ? `\\left( ${parts[0].qTerm} \\right)` : parts[0].qTerm) + ` \\,dx`;
      const cAnsStr = joinFormulaAnswers(parts.map(p => p.cAns)) + " + C";

      let candidates = [];
      if (parts.length === 1) {
        const single = parts[0];
        candidates = [
          single.d1 + " + C",
          single.d2 + " + C",
          single.d3 + " + C",
          single.d4 + " + C",
          single.d5 + " + C",
          cAnsStr.replace(" + C", "")
        ].filter(Boolean);
      }

      // Deduplicate and randomize candidates
      const uniqueCandidates = Array.from(new Set(candidates)).sort(() => Math.random() - 0.5);

      const selectedChoices = [cAnsStr];
      for (const choice of uniqueCandidates) {
        if (choice !== cAnsStr && selectedChoices.length < 4) {
          selectedChoices.push(choice);
        }
      }

      while (selectedChoices.length < 4) {
        selectedChoices.push(cAnsStr + ` + ${selectedChoices.length}`);
      }

      const shuffledChoices = selectedChoices.sort(() => Math.random() - 0.5);

      return { q: qText, cAns: cAnsStr, choices: shuffledChoices, original: parts[0] };
    }

            const isComp = practiceCat.id === "composite";
            const randomType = getRandomElement(practiceCat.types);
            deck.push(buildQuizItem(isComp, isComp ? null : randomType));

              deck.push(buildQuizItem(false, indexType));

          for (let i = 0; i < 50; i++) {

          setMonsterMood("NORMAL");

            setMonsterMood("NORMAL");
            setTimeRemaining(30);

        setChosenAnswer(chosenVal);
        setLatestCorrectAnswer(activeQuiz.cAns);

          if (nextHp <= 0) {
            setGameState("GAMEOVER");
            setMonsterMood("NORMAL");
            setActiveFeedback(null);
          } else {
            nextStage();

        if (activeFeedback || gameState !== "PLAYING") return;
        handleIncorrect("TIME UP");

        if (activeFeedback || gameState !== "PLAYING") return;

          lastTime = now;

          setTimeRemaining(prev => {
            if (prev - diff <= 0) {
              setTimeout(handleTimeout, 0);

                      <React.Fragment>
                        <div key={currentIndex + "-slash1"} className="absolute h-3 bg-gradient-to-r from-transparent via-cyan-400 to-transparent shadow-[0_0_15px_#00f2ff] pointer-events-none z-20 -rotate-44 animate-slash-line-1" style={{ width: "240px" }} />
                        <div key={currentIndex + "-slash2"} className="absolute h-3 bg-gradient-to-r from-transparent via-pink-400 to-transparent shadow-[0_0_15px_#ec4899] pointer-events-none z-20 rotate-44 animate-slash-line-1" style={{ width: "240px" }} />
                        
                        <div key={currentIndex + "-seal"} className="absolute w-36 h-36 border-2 border-[#00ebc7] rounded-full flex items-center justify-center border-dashed pointer-events-none z-20 animate-seal-rotation">
                          <span className="text-2xl text-[#00ebc7] font-mono opacity-80">∫ dx</span>
                        </div>

                        {/* Floating damage text popup */}
                        <div key={currentIndex + "-dmgText"} className="absolute font-mono font-black text-sm md:text-base text-yellow-300 drop-shadow-[0_2px_8px_rgba(0,0,0,1)] text-center pointer-events-none select-none z-30 animate-dmg-float-text">
                          <div className="text-[10px] text-pink-400 tracking-widest leading-none">封印成功 (SEAL COMPLETE)</div>
                          <div className="text-yellow-400 font-extrabold tracking-tight mt-1">-{addedScore} HP / WRONG INTEGRAL DESTROYED!</div>
                        </div>
                      </React.Fragment>
                    )}

                    {activeFeedback === "INCORRECT" && (
                      <React.Fragment>
                        <div key={currentIndex + "-impact"} className="absolute inset-0 bg-red-600/30 player-events-none z-10 rounded-lg animate-pulse" />
                        <div key={currentIndex + "-critText"} className="absolute font-mono font-black text-center pointer-events-none select-none z-30 animate-crit-dmg-text">
                          <div className="text-xl font-black text-red-500 drop-shadow-[0_2px_6px_rgba(0,0,0,1)]">💥 CRITICAL DAMAGE!</div>
                          <div className="text-xs text-red-300 drop-shadow-[0_1px_3px_rgba(0,0,0,1)] mt-1">結界決壊 / HP -1</div>
                        </div>
                      </React.Fragment>
                    )}
                  </div>

                  <div className="h-6 flex items-center justify-center font-mono">
                    {combo > 0 && (
                      <div className="text-[#00ebc7] text-xs font-bold tracking-widest animate-bounce">
                        💥 {combo} COMBO BOOST! ({100 + (combo * 15)}% PTS)
                      </div>
                    )}
                  </div>
                </div>

                {/* Hourglass Timer Slider */}
                <div className="space-y-1 font-mono">
                  <div className="flex justify-between items-end text-[10px] sm:text-xs">
                    <span className={`${timeRemaining <= 5 ? "text-red-500 animate-pulse font-bold" : "text-cyan-400"}`}>
                      TIME: {timeRemaining.toFixed(2)}s
                    </span>
                    <span className="text-gray-400 text-[10px]">{quizzes[currentIndex].original.category}</span>
                  </div>
                  <div className="w-full bg-gray-950 h-2.5 border border-cyan-500/30 overflow-hidden">
                    <div 
                      className={`h-full transition-all ease-linear ${timeRemaining <= 5 ? "bg-red-500 animate-pulse" : "bg-gradient-to-r from-cyan-400 to-blue-500"}`}
                      style={{ width: `${(timeRemaining / 30) * 100}%` }}
                    />
                  </div>
                </div>

                {/* Formulas Box */}
                <div className="bg-black/90 border-2 border-cyan-500/60 p-2 sm:p-2.5 font-mono text-center flex flex-col items-center justify-center min-h-[65px] relative rounded shadow-[0_0_15px_rgba(0,255,255,0.1)]">
                  <span className="absolute top-1 left-1.5 text-[9px] text-cyan-400/80">不定積分を求めよ:</span>
                  <MathJaxFormula math={quizzes[currentIndex].q} />
                </div>

                {/* Choice Panels Grid */}
                <div className="grid grid-cols-2 gap-1.5 sm:gap-2">
                  {quizzes[currentIndex].choices.map((choice, idx) => {
                    let btnStyle = "bg-[#0b0c10] border-2 border-pink-500 p-2 text-center text-xs sm:text-sm lg:text-base font-bold whitespace-nowrap overflow-x-auto hover:border-white transition-all duration-150 py-1.5 text-white rounded cursor-pointer";

                    if (chosenAnswer) {
                      if (choice === quizzes[currentIndex].cAns) {
                        btnStyle = "bg-green-950/80 border-2 border-[#10b981] text-green-300 font-bold p-2 text-center text-xs sm:text-sm lg:text-base whitespace-nowrap overflow-x-auto shadow-[0_0_15px_#10b981] py-1.5 rounded";
                      } else if (choice === chosenAnswer) {
                        btnStyle = "bg-red-950/80 border-2 border-red-500 text-red-300 font-bold p-2 text-center text-xs sm:text-sm lg:text-base whitespace-nowrap overflow-x-auto opacity-80 py-1.5 rounded";
                      } else {
                        btnStyle = "bg-black/40 border-2 border-gray-800 text-gray-600 p-2 text-center text-xs sm:text-sm lg:text-base whitespace-nowrap overflow-x-auto opacity-30 py-1.5 rounded";
                      }
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => handleAnswerSubmit(choice)}
                        disabled={chosenAnswer !== null}
                        className={btnStyle}
                      >
                        <MathJaxFormula math={choice} />
                      </button>
                    );
                  })}
                </div>

                {/* GRIMOIRE DICTIONARY / GUIDELINES WALKTROUGH - SHOW ON ACTIONS */}
                {activeFeedback && (
                  <div 
                    className={`p-3 border leading-snug text-xs sm:text-sm rounded font-sans transition-all duration-300 ${
                      activeFeedback === "CORRECT" 
                        ? "bg-green-950/60 border-green-500/50 text-green-200" 
                        : "bg-red-950/80 border-red-500/50 text-red-100 shadow-[0_0_15px_rgba(239,68,68,0.2)] animate-pulse"
                    }`}
                  >
                    {activeFeedback === "CORRECT" ? (
                      <div className="flex items-center gap-2">
                        <CheckCircle className="w-5 h-5 text-green-400 shrink-0" />
                        <div>
                          <span className="font-bold text-[#10b981]">正解！</span> 
                          {addedScore && `+ ${addedScore} PTSを獲得しました。`}
                        </div>
                      </div>
                    ) : (
                      <div className="space-y-2">
                        <div className="flex items-start gap-2 border-b border-red-500/20 pb-2">
                          <XCircle className="w-5 h-5 text-red-400 shrink-0 mt-0.5" />
                          <div>
                            <span className="font-bold text-red-400">MISS! 誤った積分結界を構築してしまった！</span>
                            <div className="mt-1 flex flex-wrap items-center gap-1 font-mono text-xs text-gray-300">
                              <span>解きたかった問題: </span>
                              <span className="bg-black/50 px-2 py-0.5 rounded border border-gray-800 inline-block">
                                <MathJaxFormula math={quizzes[currentIndex].q} />
                              </span>
                            </div>
                            <div className="mt-1 flex flex-wrap items-center gap-1 font-mono text-xs text-green-400">
                              <span>✓ 正しい結界公式: </span>
                              <span className="bg-black/50 px-2 py-0.5 rounded border border-green-950 inline-block font-bold">
                                <MathJaxFormula math={latestCorrectAnswer} />
                              </span>
                            </div>
                          </div>
                        </div>

                        {/* MathJax explanation note from Grimoire */}
                        <div className="bg-black/60 p-2 border-l-2 border-yellow-500 text-gray-300 select-text overflow-x-auto leading-relaxed">
                          <div className="flex items-center gap-1 text-[11px] text-yellow-400 font-bold mb-1 font-mono">
                            <BookOpen className="w-3.5 h-3.5" />
                            <span>魔導書の解説（復習ノート）:</span>
                          </div>
                          <div className="text-xs text-gray-200">
                            <MathJaxExplanation text={quizzes[currentIndex].original.explanation} />
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* 5. GAME STORY CLEAR SCREEN */}
            {gameState === "CLEAR" && (
              <div className="flex-1 flex flex-col justify-start items-center text-center space-y-1.5 z-20 py-1 max-h-[85vh] overflow-y-auto pointer-events-auto">
                <div className="relative">
                  <div className="absolute inset-0 bg-[#10b981]/15 blur-2xl rounded-full pointer-events-none" />
                  <AdaptiveMonster 
                    type={resolveMonsterType()} 
                    mood="NORMAL" 
                    gameState="CLEAR" 
                    ansWrongLength={answeredLog.length} 
                  />
                </div>

                <div className="space-y-1">
                  <h2 className="text-3xl sm:text-4xl font-black italic tracking-widest text-[#10b981] select-none uppercase drop-shadow-[0_0_10px_rgba(16,185,129,0.4)]">
                    STAGE CLEAR!!
                  </h2>
                  <p className="text-[11px] sm:text-xs text-cyan-400 tracking-wider">
                    見事、全ての不定積分を封じモンスターを撃破しました！
                  </p>
                </div>

                <div className="w-full max-w-sm bg-black/80 border-2 border-[#10b981] p-3 text-center rounded shadow-[0_0_20px_rgba(16,185,129,0.15)] font-mono">
                  <div className="text-[10px] text-gray-400">FINAL RESULT</div>
                  <div className="text-2xl font-black text-yellow-300 mt-0.5">{score} <span className="text-xs text-gray-300">PTS</span></div>
                  
                  <div className="grid grid-cols-1 gap-1.5 text-center text-[10px] text-gray-300 border-t border-gray-900 mt-2 pt-2">
                    <div>戦闘モード: <span className="text-purple-300 font-bold">{gameMode}</span></div>
                  </div>
                </div>

                {/* Complete History Grimoire Lists */}
                <div className="w-full bg-black/90 p-2.5 border-2 border-pink-500 rounded font-sans text-xs shadow-[inset_0_0_15px_#f0f] text-left">
                  <h3 className="text-pink-500 text-center mb-1.5 font-mono font-bold tracking-widest border-b border-pink-500/20 pb-1 flex items-center justify-center gap-1.5">
                    <BookOpen className="w-3.5 h-3.5" />
                    <span>-- 積分ミス復習魔導書 --</span>
                  </h3>
                  
                  {answeredLog.length === 0 ? (
                    <div className="text-center text-[#10b981] py-2 font-bold space-y-0.5">
                      <div>🎯 PERFECT VICTORY!</div>
                      <div className="text-[11px] text-gray-400 font-normal">本日の積分ミス： 0 問。完璧な結界戦闘術でした！</div>
                    </div>
                  ) : (
                    <div className="space-y-3.5 max-h-44 overflow-y-auto pr-1">
                      {answeredLog.map((log, idx) => (
                        <div key={idx} className="border-b border-gray-800 pb-2 last:border-none last:pb-0 font-sans space-y-1">
                          <div className="font-mono text-cyan-400 whitespace-nowrap overflow-x-auto p-1 bg-white/5 rounded border border-gray-900 font-bold">
                            Q: <MathJaxFormula math={log.q} />
                          </div>
                          <div className="text-red-400 pl-1 flex items-center overflow-x-auto">
                            <span>× あなたの解答: </span>
                            <span className="font-mono ml-1 inline-block"><MathJaxFormula math={log.user === "TIME UP" ? "時間切れ" : log.user} /></span>
                          </div>
                          <div className="text-[#10b981] pl-1 flex items-center overflow-x-auto font-bold">
                            <span>◯ 公式の正解: </span>
                            <span className="font-mono ml-1 inline-block"><MathJaxFormula math={log.correct} /></span>
                          </div>
                          <div className="bg-black/50 p-1.5 border-l-2 border-yellow-500 text-[11px] text-gray-300 leading-normal mt-1 leading-snug">
                            <span className="text-yellow-400 font-bold block mb-0.5">↳ 復習の急所:</span>
                            <MathJaxExplanation text={log.explanation} />
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="flex gap-4 w-full pt-1">
                  <button
                    onClick={() => {
                      setGameState("MODE_SELECT");
                      setMonsterMood("NORMAL");
                      setActiveFeedback(null);
                    }}
                    className="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded transition-all shadow-[0_0_15px_rgba(0,255,255,0.2)] cursor-pointer"
                  >
                    ホームメニューへ
                  </button>
                </div>
              </div>
            )}

            {/* 6. GAME OVER VIEW */}
            {gameState === "GAMEOVER" && (
              <div className="flex-1 flex flex-col justify-start items-center text-center space-y-1.5 z-20 py-1 max-h-[85vh] overflow-y-auto pointer-events-auto">
                <div className="relative">
                  <div className="absolute inset-0 bg-red-900/15 blur-2xl rounded-full pointer-events-none" />
                  <AdaptiveMonster 
                    type={resolveMonsterType()} 
                    mood="NORMAL" 
                    gameState="GAMEOVER" 
                  />
                </div>

                <div className="space-y-1">
                  <h2 className="text-3xl sm:text-4xl font-extrabold italic tracking-widest text-red-500 select-none uppercase drop-shadow-[0_0_8px_rgba(220,38,38,0.3)]">
                    GAME OVER
                  </h2>
                  <p className="text-[11px] sm:text-xs text-gray-400">
                    HPがゼロになりました！ 積分結界が崩壊し魔獣が暴走しています。
                  </p>
                </div>

                <div className="w-full max-w-sm bg-black/80 border-2 border-red-500 p-3 rounded shadow-[0_0_15px_rgba(220,38,38,0.15)] font-mono">
                  <div className="text-[10px] text-gray-400">FINAL RESULT</div>
                  <div className="text-2xl font-black text-yellow-300 mt-0.5">{score} <span className="text-xs text-gray-300">PTS</span></div>
                  
                  <div className="grid grid-cols-1 gap-1.5 text-center text-[10px] text-gray-300 border-t border-gray-900 mt-2 pt-2">
                    <div>到達ステージ: <span className="text-pink-300 font-bold">{currentIndex + 1}ステージ</span></div>
                  </div>
                </div>

                {/* Analysis of Game Over mistakes */}
                {answeredLog.length > 0 && (
                  <div className="w-full bg-black/90 p-2.5 border-2 border-pink-500 rounded font-sans text-xs shadow-[inset_0_0_15px_#f0f] text-left">
                    <h3 className="text-pink-500 text-center mb-1.5 font-mono font-bold tracking-widest border-b border-pink-500/20 pb-1 flex items-center justify-center gap-1.5">
                      <BookOpen className="w-3.5 h-3.5" />
                      <span>-- 敗因分析＆復習ノート --</span>
                    </h3>
                    <div className="space-y-3.5 max-h-44 overflow-y-auto pr-1">
                      {answeredLog.map((log, idx) => (
                        <div key={idx} className="border-b border-gray-800 pb-2 last:border-none last:pb-0 font-sans space-y-1">
                          <div className="font-mono text-cyan-400 whitespace-nowrap overflow-x-auto p-1 bg-white/5 rounded border border-gray-900 font-bold">
                            Q: <MathJaxFormula math={log.q} />
                          </div>
                          <div className="text-red-400 pl-1 flex items-center overflow-x-auto">
                            <span>× あなたの解答: </span>
                            <span className="font-mono ml-1 inline-block"><MathJaxFormula math={log.user === "TIME UP" ? "時間切れ" : log.user} /></span>
                          </div>
                          <div className="text-[#10b981] pl-1 flex items-center overflow-x-auto font-bold">
                            <span>◯ 正しい公式: </span>
                            <span className="font-mono ml-1 inline-block"><MathJaxFormula math={log.correct} /></span>
                          </div>
                          <div className="bg-black/50 p-1.5 border-l-2 border-yellow-500 text-[11px] text-gray-300 leading-normal mt-1 leading-snug">
                            <span className="text-yellow-400 font-bold block mb-0.5">↳ 復習の急所:</span>
                            <MathJaxExplanation text={log.explanation} />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="flex gap-4 w-full pt-1">
                  <button
                    onClick={() => {
                      setGameState("MODE_SELECT");
                      setMonsterMood("NORMAL");
                      setActiveFeedback(null);
                    }}
                    className="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded transition-all cursor-pointer"
                  >
                    ホームメニューへ戻る
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
